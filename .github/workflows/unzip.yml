name: Unzip site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit site files
        run: |
          unzip -o jasper-site-github.zip
          shopt -s dotglob
          mv jasper-deploy-cloudflare/* .
          rm -rf jasper-deploy-cloudflare jasper-site-github.zip
          git config user.name "jasper-industries"
          git config user.email "iamomeryafai4u@gmail.com"
          git add -A
          git commit -m "Extract site files to repo root" || echo "nothing to commit"
          git push
